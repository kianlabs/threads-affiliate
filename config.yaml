# ============================================================
# Konfigurasi v1 — Sistem Affiliate Shopee → Threads + Facebook
# Akun: @temuanhariann.id | Niche awal: home living / kos-kosan
# (diputuskan lewat riset 16 Nov 2026; beauty = expansion #2)
# ============================================================

akun:
  threads_username: "@temuanhariann.id"
  shopee_affiliate: "pratama"          # nama akun di dashboard affiliate.shopee.co.id

# Jadwal posting (WIB, Asia/Jakarta). Server/PC harus di zona waktu ini.
jadwal:
  timezone: "Asia/Jakarta"
  slot:
    "09:00": "dapur"
    "12:30": "organizer"
    "19:30": "kebersihan"
  # Slot riset 16 Nov 2026 (RISET-JADWAL.md): 09:00/12:30/19:30 WIB,
  # jitter ±15-30 mnt/hari. Jadwal lama d4ncboz 08:00/13:00/20:00.
  posts_per_day_max: 3

# Kriteria produk — WAJIB dicek saat isi database link (lihat docs/isi-link-db.md)
kriteria_produk:
  rating_min: 4.8            # dicek di halaman produk Shopee (UI affiliate tidak menampilkan rating)
  terjual_min: 1000
  harga_min_rp: 20000
  harga_max_rp: 100000
  seller: ["Star", "Star+", "Mall"]   # Star Seller / Shopee Mall
  komisi_xtra_wajib: true    # hanya produk ber-Komisi XTRA yang masuk database

# Format posting — aturan Kyan (lihat guardrails.md)
format_post:
  num_posts: 2               # 2 = hook + CTA. Link ada di post ke-2 (self-reply pertama),
                             # BUKAN di post utama. Jangan ubah ke 3 tanpa alasan.
  link_di_post_utama: false
  link_shortener_dilarang: ["bit.ly", "s.id", "tinyurl.com"]
  disclosure_wajib: "TIDAK ADA — kata komisi/commission/affiliate DILARANG di teks post"  # aturan Kyan 16 Nov 18:50
    # kata 'komisi' / 'commission' / 'affiliate' (termasuk #affiliate /
    # #ShopeeAffiliate) DILARANG di post. TIDAK ADA disclosure komisi.
  max_chars_per_post: 500    # batas Threads

# Path (relatif terhadap root repo ini; cookies SELALU di luar repo)
path:
  cookies: "~/.threads_poster/cookies/session.json"
  database: "data/affiliate_links.md"
  history: "data/post_history.json"
  templates: "templates"
  logs: "logs/cron.log"

# Vendor (basis kode — jangan edit langsung kecuali via VENDOR-NOTES.md)
vendor:
  repo: "https://github.com/d4ncboz/threads-affiliate"
  dir: "vendor/threads-affiliate"
  license: "MIT"

# Fase 2 (BELUM AKTIF — lihat README.md)
fase2:
  shopee_open_api:
    status: "TERTAHAN — akun belum punya akses (AppID/Secret kosong, tombol Apply nonaktif)"
    catatan: "Link 'contact us' di halaman Open API nyasar ke artikel Help Center soal pelanggaran, bukan form pengajuan. Jalur yang tersisa: hubungi CS Shopee via live chat."
  threads_official_api:
    status: "LIVE 16 Nov 2026 — token tersimpan ~/.threads_poster/threads_token.env (mode 600)"
    post_pertama: "17:51 Kikkoman, terverifikasi via API; systemd timer 09:00/12:30/19:30 AKTIF (run_slot.py --api)"
  ai_drafting:
    status: "RENCANA — draf AI via provider gratis 9Router (bukan template statis)"

# Pinterest (DITAMBAH 16 Nov 2026 — MODUL SIAP, TOKEN BELUM ADA)
# Akun: Yozo (@dirtoflegend) — sudah terhubung ke Shopee Affiliate 'pratama'
# (17 Nov 2026, dikonfirmasi Kyan). Tagging produk native dilakukan MANUAL
# di aplikasi Pinterest (API v5 tidak bisa tagging). Timer DISABLED sampai
# token + dry-run lolos (lihat docs/pinterest.md).
pinterest:
  status: "MODUL SIAP — token BELUM ADA (dry-run saja)"
  akun: "Yozo (@dirtoflegend)"
  board_id: ""             # isi setelah buat board di Pinterest (mis. board home living/kos)
  max_pins_per_day: 1      # Pinterest melarang Pin afiliasi "repetitif / jumlah besar"
  jadwal: "10:00"          # timer systemd DISABLED (ops/pinterest-1000.timer)
  disclosure: "#ad di awal deskripsi (tanpa kalimat komisi)"
  token_path: "~/.pinterest_poster/pinterest_token.env"

# Facebook (DITAMBAH 16 Nov atas perintah Kyan — BELUM AKTIF)
facebook:
  status: "RENCANA — upload ke Facebook juga (Page Temuan Harian); setup profil Page + Meta Ads menyusul"
  page: "Temuan Harian"
